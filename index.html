<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#5f8985">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Jouw persoonlijke Karada dashboard voor training, voeding en voortgang.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="manifest" href="manifest.webmanifest?v=13">
  <link rel="icon" type="image/png" href="Screenshot%202026-04-08%20162514.png">
  <link rel="apple-touch-icon" href="Screenshot%202026-04-08%20162514.png">
  <title>Karada Performance</title>
  <link rel="stylesheet" href="styles.css?v=13">
</head>
<body>
  <div id="splash" class="splash" role="status" aria-label="Karada wordt geopend">
    <img src="Screenshot%202026-04-08%20162514.png" alt="Karada">
  </div>

  <div id="app" class="app-shell is-loading">
    <header class="topbar">
      <div><div class="eyebrow">KARADA PERFORMANCE</div><h1 id="pageTitle">Home</h1></div>
    </header>
    <main id="view"></main>
    <nav id="nav" aria-label="Hoofdnavigatie">
      <div class="desktop-brand"><img src="Screenshot%202026-04-08%20162514.png" alt=""><span>Karada</span></div>
      <button data-tab="home"><span>⌂</span>Home</button>
      <button data-tab="training"><span>◇</span>Training</button>
      <button data-tab="diary"><span>◉</span>Voeding</button>
      <button data-tab="weeks" class="desktop-only"><span>▦</span>Planning</button>
      <button data-tab="checkin" class="desktop-only"><span>⌁</span>Check-in</button>
      <button data-tab="longevity" class="desktop-only"><span>♡</span>Longevity</button>
      <button data-tab="courses" class="desktop-only"><span>◫</span>Leeromgeving</button>
      <button data-tab="shopping" class="desktop-only"><span>⌑</span>Boodschappen</button>
      <button data-tab="profile" class="desktop-only"><span>◎</span>Profiel</button>
      <button data-tab="more" class="mobile-more"><span>•••</span>Meer</button>
    </nav>
  </div>

  <div id="moreOverlay" class="more-overlay" aria-hidden="true" onclick="closeMoreMenu(event)">
    <section class="more-sheet" role="dialog" aria-modal="true" aria-labelledby="moreTitle" onclick="event.stopPropagation()">
      <div class="sheet-handle"></div>
      <div class="more-head"><h2 id="moreTitle">Meer</h2><button onclick="closeMoreMenu()" aria-label="Sluiten">×</button></div>
      <div class="more-grid">
        <button onclick="goToTab('weeks')"><span>▦</span>Planning</button>
        <button onclick="goToTab('checkin')"><span>⌁</span>Check-in</button>
        <button onclick="goToTab('longevity')"><span>♡</span>Longevity</button>
        <button onclick="goToTab('courses')"><span>◫</span>Leeromgeving</button>
        <button onclick="goToTab('shopping')"><span>⌑</span>Boodschappen</button>
        <button onclick="goToTab('profile')"><span>◎</span>Profiel</button>
      </div>
    </section>
  </div>

  <div id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=13"></script><script src="data.js?v=13"></script><script src="nl-recipes.js?v=13"></script><script src="app.js?v=13"></script><script src="training-data.js?v=13"></script><script src="training.js?v=13"></script><script src="cloud-client.js?v=13"></script>
</body>
</html>
